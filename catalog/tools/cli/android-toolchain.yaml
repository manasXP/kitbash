name: android-toolchain
kind: cli
description: Android Studio's SDK and JDK with the project's Gradle wrapper, for the Kotlin + Jetpack Compose companion app.
provides: [mobile-toolchain]
commands:
  build: ./gradlew assembleDebug
  test: ./gradlew test
  lint: ./gradlew lint
env:
  ANDROID_HOME: ${ANDROID_HOME:-~/Library/Android/sdk}
  JAVA_HOME: ${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}
skill: null
artifacts: [build, .gradle, .kotlin, local.properties]
