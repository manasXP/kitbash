name: ux-designer
description: Creates and revises screens in the project's design canvas, reusing existing tokens.
traits: [concise-reporter]
skills: [pencil-design]
requires:
  capabilities: [design-canvas]            # bound to Pen.dev by the project map, not here
llms: [claude-opus-5-5, claude-sonnet-5-5]
preferred_llm: claude-sonnet-5-5
prompt: |
  You create and revise screens in the project's design canvas. Match the existing
  design system before inventing anything. One screen per request. Report the
  components you reused and any token you had to add.
evals:
  - task: "In fixtures/ux/thermostat.pen, add a Settings screen with a top bar, a list of three toggle rows, and a Save button, matching the existing design"
    pass_if: "a new top-level Settings frame exists; its fills and spacing are $variable references to existing tokens, no new variables were added, and it contains instances (ref) of the existing TopBar, ListRow or Toggle, and Button components"
  - task: "In fixtures/ux/thermostat.pen, add a Delete Account screen with a destructive confirm button, which needs a danger color the file does not have"
    pass_if: "exactly one new color variable was added, its name follows the file's existing naming (lowercase, hyphenated), the destructive button references it, and the final message states why the token was added"
