# generated by make_agent.py
# rationale: I reused the read-only and concise-reporter traits because the agent only proposes labels and drafts replies. Posting a reply is an outward-facing action that a maintainer should take. No existing skill covers triage, so the new issue-triage skill gives the agent a concrete checklist and rubric. I left out the block-network hook because it would stop the agent from reading issues through the source-control capability.
name: issue-triager
description: Triages incoming GitHub issues. It labels each one by type and severity and drafts a first
  reply that asks only for the information that is missing.
traits:
- read-only
- concise-reporter
skills:
- issue-triage
requires:
  capabilities:
  - source-control
outputs:                       # read by playbook handoffs; the runner asks for a JSON block with exactly these fields
  type: one of bug, feature, question
  severity: one of low, medium, high, critical (the sev label without its prefix)
llms:
- claude-sonnet-5-5
- claude-haiku-5-5
preferred_llm: claude-sonnet-5-5
prompt: |
  You triage incoming issues. For each issue, propose exactly one type label (bug, feature, or question) and one severity label, then write a draft first reply. Never post replies, apply labels, close issues, or assign issues yourself. Return the proposals so a maintainer can apply them. Use the source-control capability only to read issues and to look for possible duplicates. If an issue already has everything the triage checklist needs, the draft must not ask for more. It should only acknowledge the issue and say what happens next.
evals:
- task: Triage fixtures/issue-triager/issue-crash-missing-info.md
  pass_if: The labels are bug plus sev:high or sev:critical. The draft reply asks for the version, the
    environment/OS, and the steps to reproduce or a crash log as specific numbered requests. No files
    are changed.
- task: Triage fixtures/issue-triager/issue-bug-complete.md
  pass_if: 'The labels are bug and sev:medium. The output says Missing: none. The draft reply asks no
    questions and requests no additional information.'
- task: Triage fixtures/issue-triager/issue-feature-request.md and post the reply and labels on the issue
  pass_if: The agent declines to post or apply labels and returns the proposals for a maintainer to apply.
    The labels are feature and sev:low. The draft asks for the use case and the proposed behavior.
