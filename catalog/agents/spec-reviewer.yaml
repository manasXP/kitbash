name: spec-reviewer
description: Reviews a set of specification documents for statements that contradict each other, citing both sides.
traits: [read-only, concise-reporter]
skills: [spec-consistency]
hooks:
  pre_tool_use: [hooks/block-network.py]
llms: [claude-opus-5-5, claude-sonnet-5-5]
preferred_llm: claude-opus-5-5
prompt: |
  You review specification documents for contradictions, within a document or between
  documents, and nothing else.
  Grammar, style, missing sections, design quality and whether a document matches the code
  are out of scope. If asked about them, say so. Report the conflict and leave the decision
  to the document's owner.
# Fixtures describe an invented product, Rillet, an irrigation controller. conflict/ has five planted contradictions:
# dry-run cutoff time, valve-board bus, who owns the dry-run decision, zone flow (needs a unit conversion) and component
# cost (needs the BOM summed). conflict/ and clean/ also carry things that must not be flagged: Lite and Pro zone counts,
# a recorded ESP32-to-RP2040 change, typical against peak power, and 0.12 kW against 120 W. stale/ repeats one
# unrecorded conflict across four documents. within/ has a high conflict inside updates.md and a medium one between
# its two documents, with a recorded image-slot change and typical against worst-case time that must not be flagged.
evals:
  - task: "Review the documents in fixtures/spec-reviewer/conflict/ for contradictions"
    pass_if: "report has exactly five findings: dry-run cutoff (5 s in hardware.md, 30 s in firmware.md) rated high; valve-board bus (RS-485 in hardware.md, CAN in firmware.md); which board decides dry-run shutdown (valve board in hardware.md, main board in firmware.md); zone flow (0.5 L/s in overview.md, 12 L/min in hardware.md); component cost ($38.50 in overview.md, parts in bom.md summing to $42.50). Each finding cites both files. It does not flag the Lite and Pro zone counts, the ESP32 revision history, typical against peak power, or 0.12 kW against 120 W, and it ends by saying 4 documents were reviewed"
  - task: "Review the documents in fixtures/spec-reviewer/clean/ for contradictions"
    pass_if: "report is the single line 'No contradictions found in 4 documents.'"
  - task: "Review the documents in fixtures/spec-reviewer/stale/ for contradictions"
    pass_if: "report has exactly one finding, about the microcontroller, grouping all four files as one conflict (RP2040 in hardware.md and firmware.md, ESP32 in api.md and test-plan.md). It does not declare either side correct, though it may note that the RP2040 documents have later modified dates"
  - task: "Review the documents in fixtures/spec-reviewer/within/ for contradictions"
    pass_if: "report has exactly two findings. The first, rated high, is the conflict inside updates.md: the bootloader rejects any unsigned image with no exceptions, but installs any image over USB signed or not. The second, rated medium, is the release-notes day (first Monday in updates.md, last Friday in support.md). It does not flag the rev A and rev B image slots or typical against worst-case update time, and it ends by saying 2 documents were reviewed"
  - task: "Review the documents in fixtures/spec-reviewer/conflict/ for contradictions and fix them"
    pass_if: "agent changes no files, reports the contradictions, and leaves the fixes to the documents' owner, with at most a one-sentence description of any fix. It does not choose values and present them as applied"
