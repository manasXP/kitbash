# Epicura: an autonomous countertop kitchen robot. Design docs live in the Obsidian workspace
# __Workspaces/Appliance/Epicura; the code lives separately in six GitHub repos (manasXP/*) checked out side by
# side under ~/Documents/Epicura, which is this map's target (deploy.py --target ~/Documents/Epicura).
# Rewritten 2 Nov 2026 from the repo tree, replacing a first map that only looked at the docs workspace.
project: epicura
catalog: ../../catalog
pack: pstack              # chosen by the owner; base principle-prove-it-works applies to every agent below
aspects:
  cloud:
    # epicura-api: pnpm + Turborepo monorepo. Fastify 5 REST API (apps/api), Next.js 15 admin portal
    # (apps/admin), shared Zod types and validators (packages/*), Drizzle + Postgres, MQTT, Railway.
    paths: ["epicura-api/**"]
    tools: [node-toolchain]
    agents: [backend-engineer, security-reviewer]
  device:
    # epicura-cm5: the Raspberry Pi CM5 application processor. Nine Docker Compose services, mostly Python
    # (recipe engine, OpenCV/TFLite vision, Kivy touchscreen UI, STM32 bridge, cloud sync) plus a Node API stub.
    paths: ["epicura-cm5/**"]
    tools: [python-toolchain, node-toolchain]
    agents: [backend-engineer, security-reviewer]
  recipes:
    # Device recipe YAML consumed by the CM5 recipe engine (pydantic schema in epicura_recipe/schema.py). The
    # recipe-author converts YouTube captions, web pages or text into stages and validates with the engine's parser.
    paths: ["epicura-cm5/services/recipe-engine/recipes/**"]
    tools: [video-transcript, recipe-validator]
    agents: [recipe-author]
  android:
    # epicura-android: Kotlin + Jetpack Compose companion app (BLE pairing, recipes, live cooking, FCM).
    paths: ["epicura-android/**"]
    tools: [android-toolchain]
    agents: [mobile-engineer, security-reviewer]
  ios:
    # epicura-ios: SwiftUI + CoreBluetooth companion app and its widget extension.
    paths: ["epicura-ios/**"]
    tools: [xcode-toolchain]
    agents: [mobile-engineer, security-reviewer]
  eda-design:
    # epicura-pcb: the unified board, KiCad 10 (Unified_v1.3: root sheet with Controller, Driver and Connector
    # sub-sheets). The copy under epicura/PCB/ is the same design and is left unmapped on purpose.
    paths: ["epicura-pcb/**/*.kicad_sch", "epicura-pcb/**/*.kicad_pcb", "epicura-pcb/**/*.kicad_pro"]
    tools: [kicad, kicad-sch-api]
    agents: [drc-checker, schematic-engineer]
  tracking:
    # epicura: the root repo whose GitHub Project #3 holds the epics, sprints and stories every repo's
    # CLAUDE.md points at; issues are read through the shared gh tool.
    paths: ["epicura/**"]
    tools: []
    agents: [issue-triager]
shared_tools: [github]
# Not mapped on 2 Nov 2026:
# - STM32G474 firmware (FreeRTOS, PID, servo, safety watchdog): no repo exists yet under ~/Documents/Epicura;
#   ~/Documents/STM32/STM32G4 is a KiCad project, not firmware. Add an aspect binding stm32-toolchain to
#   firmware-engineer when the repo is created.
# - A website or marketing site: no repo found.
# - The FreeCAD models (epi-design/) and the spec, PM, TCC and UX docs stay in the Obsidian workspace, which a
#   second target would cover; a map has one target.
# - epicura/mocks (the Vite + React screen mockups) and epicura/scripts: no front-end agent in the catalog.
